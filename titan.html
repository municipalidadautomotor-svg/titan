cv.onpointermove=e=>{if(!down)return;ry+=(e.clientX-down[0])*.008;rx=Math.max(-.2,Math.min(.5,rx+(e.clientY-down[1])*.004));down=[e.clientX,e.clientY]};
cv.onwheel=e=>{e.preventDefault();dist=Math.max(4,Math.min(12,dist+e.deltaY*.005))};
let pin=0;cv.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pin)dist=Math.max(4,Math.min(12,dist-(d-pin)*.02));pin=d}});cv.addEventListener('touchend',()=>pin=0);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}addEventListener('resize',resize);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(t){requestAnimationFrame(loop);const v=conv?conv.getOutputVolume():vol;
if(view2){$('img').style.transform=reduce?'':`scale(${1+Math.min(v,1)*.02})`;return}
mouth.scale.y=1+Math.min(v,1)*9;mouth.scale.x=1+Math.min(v,1)*.5;hd.rotation.z=reduce?0:Math.sin(t/900)*.03+v*.05;hd.rotation.y=Math.sin(t/2500)*.1;
W.scale.y=1+Math.sin(t/1200)*.004;W.rotation.y=0;C.position.set(Math.sin(ry)*dist,1.9+rx*dist,Math.cos(ry)*dist);C.lookAt(0,1.6,0);R.render(S,C)})(0);
/* ---- Voz ---- */
$('talk').onclick=async()=>{if(conv){await conv.endSession();conv=null;$('talk').textContent='Hablar con Titán';st('Conversación terminada.');return}
if(!AGENT_ID){st('Falta el ID del agente: abrí la página con ?agente=TU_ID');return}
try{st('Conectando… permití el micrófono.');const {Conversation}=await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm');
await navigator.mediaDevices.getUserMedia({audio:true});
conv=await Conversation.startSession({agentId:AGENT_ID,connectionType:'websocket',onModeChange:m=>st(m.mode==='speaking'?'Titán habla…':'Te escucha…'),onDisconnect:()=>{conv=null;$('talk').textContent='Hablar con Titán'}});
$('talk').textContent='Terminar conversación'}catch(e){conv=null;st('No se pudo conectar: '+(e.message||e))}};
$('demo').onclick=()=>{const u=new SpeechSynthesisUtterance('Che, el rugby se juega con la cabeza, el corazón y el equipo. ¡Y después, tercer tiempo para todos!');u.lang='es-AR';let k;u.onstart=()=>{k=setInterval(()=>vol=Math.random()*.8,90);st('Hablando (voz del dispositivo)…')};u.onend=()=>{clearInterval(k);vol=0;st('Listo.')};speechSynthesis.cancel();speechSynthesis.speak(u)};
</script></body></html>
